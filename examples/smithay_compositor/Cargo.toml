[package]
name = "smithay_compositor"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
# Blitz dependencies
blitz-smithay = { workspace = true }
anyrender_vello = { workspace = true }
blitz-dom = { workspace = true }
blitz-html = { workspace = true }
blitz-shell = { workspace = true }

# Smithay dependencies - conditional compilation based on system library availability
# Enable with: cargo build --features="smithay-backend"
smithay = { version = "0.3", optional = true }
wayland-server = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", optional = true }

# Utility dependencies
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { workspace = true }

[features]
default = []
smithay-backend = ["smithay", "wayland-server", "wayland-protocols"]
