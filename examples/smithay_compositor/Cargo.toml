[package]
name = "smithay_compositor"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
# Blitz dependencies
blitz-smithay = { workspace = true }
anyrender_vello = { workspace = true }
blitz-dom = { workspace = true }
blitz-html = { workspace = true }
blitz-shell = { workspace = true }

# Smithay dependencies - enabling for real Wayland compositor functionality
smithay = { version = "0.7", features = ["wayland_frontend"], optional = true }
wayland-server = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["server"], optional = true }

# Utility dependencies
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { workspace = true }

[features]
default = ["smithay-backend"]
smithay-backend = ["smithay", "wayland-server", "wayland-protocols"]

[[bin]]
name = "smithay_compositor"
path = "src/main.rs"
